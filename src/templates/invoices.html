<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Facture</title>
    <style>
      body {
        font-family: 'Arial', sans-serif;
        background: #f8f9fa;
        margin: 0;
        padding: 40px 0;
        display: flex;
        justify-content: center;
        align-items: center;
      }
      .invoice-container {
        width: 700px;
        background: #ffffff;
        padding: 30px;
        border-radius: 8px;
        box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
        border: 1px solid #ddd;
      }
      .header {
        text-align: center;
        border-bottom: 2px solid #007bff;
        padding-bottom: 15px;
        margin-bottom: 20px;
      }
      .header h1 {
        color: #007bff;
        font-size: 22px;
        margin: 0;
      }
      .details {
        margin-bottom: 20px;
        font-size: 14px;
        color: #333;
      }
      .details p {
        margin: 8px 0;
      }
      .divider {
        border-bottom: 1px solid #ddd;
        margin: 20px 0;
      }
      .total {
        font-size: 18px;
        font-weight: bold;
        text-align: right;
        color: #007bff;
      }
      .footer {
        text-align: center;
        font-size: 12px;
        color: #777;
        margin-top: 30px;
        border-top: 1px solid #ddd;
        padding-top: 10px;
      }
    </style>
  </head>
  <body>
    <div class="invoice-container">
      <div class="header">
        <h1>Facture</h1>
      </div>

      <div class="details">
        <p><strong>Client :</strong> {{userName}}</p>
        <p><strong>Email :</strong> {{userEmail}}</p>
        <p><strong>Date :</strong> {{date}}</p>
      </div>

      <div class="divider"></div>

      <div class="details">
        <p><strong>Projet :</strong> {{projectTitle}}</p>
        <p><strong>Service :</strong> {{serviceName}}</p>
      </div>

      <div class="divider"></div>

      <div class="total">
        <p>Total : {{amount}} {{currency}}</p>
      </div>

      <div class="footer">
        Merci pour votre confiance !<br />
        Cette facture est générée automatiquement et ne nécessite pas de
        signature.
      </div>
    </div>
  </body>
</html>
